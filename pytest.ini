[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=scripts --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = scripts
omit =
    scripts/__init__.py
    scripts/official/*
    tests/*

[coverage:report]
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise NotImplementedError
    if TYPE_CHECKING:
