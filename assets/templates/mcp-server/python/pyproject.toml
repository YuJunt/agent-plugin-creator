[project]
name = "mcp-server-template"
version = "1.0.0"
description = "MCP server template for Agent Plugin (Python / FastMCP)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-server-template = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
