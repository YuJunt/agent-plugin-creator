name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short --no-cov

    - name: Run static checks
      run: |
        pytest tests/unit/test_static_checks.py -v --tb=short --no-cov

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pyflakes

    - name: Run syntax check on all scripts
      run: |
        python -m compileall scripts/ -q
        echo "✅ All scripts compile successfully"

  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Run security audit on skill itself
      run: |
        python scripts/audit_plugin.py . || echo "⚠️  Security audit found issues (review manually)"
